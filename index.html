<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070a10" />
    <meta name="description" content="A fast, playful two-player arcade football match." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='29' fill='%23fff' stroke='%23070a10' stroke-width='4'/%3E%3Cpath d='m32 14 11 8-4 13H25l-4-13zM21 22 9 18m34 4 12-4M25 35l-5 14m19-14 5 14M20 49l-11-5m35 5 11-5' fill='none' stroke='%23070a10' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <title>2D Football Wars</title>
  </head>
  <body>
    <main class="game-shell">
      <div id="menu-root"></div>
      <div id="game-root" hidden>
      <section class="arena-wrap" aria-label="Football match">
        <canvas id="game-canvas" width="1600" height="900" aria-label="2D Football Wars stadium and live match" role="img"></canvas>
        <div class="scoreboard" aria-live="polite">
          <div class="score-side blue-side"><span class="team-tag">BLUE</span><strong id="blue-score">0</strong></div>
          <div class="match-clock"><strong id="clock">1:00</strong><span id="match-label">QUICK MATCH</span></div>
          <div class="score-side red-side"><strong id="red-score">0</strong><span class="team-tag">RED</span></div>
        </div>
        <div class="match-message" id="match-message" aria-live="polite"></div>
        <div class="arena-actions">
          <button class="icon-button" id="pause-btn" type="button" aria-label="Pause match" title="Pause match"><span class="pause-icon" aria-hidden="true">Ⅱ</span></button>
          <button class="icon-button menu-button" id="menu-btn" type="button" aria-label="Return to main menu" title="Main menu"><span aria-hidden="true">⌂</span></button>
        </div>
        <div class="player-hud blue-hud" aria-label="Blue player status"><span class="hud-name">BLUE <b id="blue-player-name">1</b></span><div class="meter health-meter"><i id="blue-health"></i></div><div class="meter stamina-meter"><i id="blue-stamina"></i></div><span class="hud-state" id="blue-state"></span></div>
        <div class="player-hud red-hud" aria-label="Red player status"><span class="hud-name">RED <b id="red-player-name">2</b></span><div class="meter health-meter"><i id="red-health"></i></div><div class="meter stamina-meter"><i id="red-stamina"></i></div><span class="hud-state" id="red-state"></span></div>
        <div class="arena-mode-label" id="arena-mode-label">CLASSIC · QUICK MATCH</div>
        <div class="touch-controls" aria-label="Touch controls">
          <div class="touch-cluster movement-cluster">
            <button class="touch-button" data-control="blueLeft" aria-label="Move left">←</button>
            <button class="touch-button" data-control="blueRight" aria-label="Move right">→</button>
            <button class="touch-button jump-touch" data-control="blueJump" aria-label="Jump">↑</button>
          </div>
          <div class="touch-cluster action-cluster">
            <button class="touch-button base-touch brace-touch" data-control="blueBrace" aria-label="Brace">BRACE</button>
            <button class="touch-button base-touch slide-touch" data-control="blueSlide" aria-label="Slide">SLIDE</button>
            <button class="touch-button base-touch sprint-touch" data-control="blueSprint" aria-label="Sprint">RUN</button>
            <button class="touch-button base-touch kick-touch" data-control="blueKick" aria-label="Shoot, release to kick">SHOOT</button>
            <button class="touch-button combat-touch jab-touch" data-control="blueJab" aria-label="Jab">JAB</button>
            <button class="touch-button combat-touch leg-touch" data-control="blueLeg" aria-label="Leg kick">LEG</button>
            <button class="touch-button combat-touch uppercut-touch" data-control="blueUppercut" aria-label="Uppercut">UP</button>
            <button class="touch-button combat-touch sweep-touch" data-control="blueSweep" aria-label="Sweep">SWEEP</button>
            <button class="touch-button power-touch power-1" data-control="bluePower1" aria-label="Cannon shot">P1</button>
            <button class="touch-button power-touch power-2" data-control="bluePower2" aria-label="Magnet">P2</button>
            <button class="touch-button power-touch power-3" data-control="bluePower3" aria-label="Super jump">P3</button>
            <button class="touch-button power-touch power-4" data-control="bluePower4" aria-label="Freeze">P4</button>
            <button class="touch-button power-touch power-5" data-control="bluePower5" aria-label="Heal">P5</button>
            <button class="touch-button touch-mode-button" id="touch-mode-btn" type="button" aria-label="Show combat controls">⚡</button>
          </div>
        </div>
      </section>

      <section class="skill-bar" aria-label="Blue player skills">
        <div class="skill-bar-head">
          <div class="skill-heading"><span class="skill-bar-title">蓝队技能</span><span class="skill-bar-hint">Z 炮击 · C 吸球 · V 高跳 · B 冻结 · N 回血</span></div>
          <div class="skill-energy" aria-label="Energy">
            <span class="skill-energy-label">Energy</span><strong id="skill-energy-value">35 / 100</strong>
            <div class="skill-energy-meter"><i id="skill-energy-fill"></i></div>
          </div>
        </div>
        <div class="skill-list">
          <button class="skill-button skill-cannon" type="button" data-control="bluePower1" data-skill="1" aria-label="Cannon Shot 炮击必杀, 35 energy, ready" title="Cannon Shot">
            <span class="skill-icon" aria-hidden="true">✹</span><span class="skill-key"><b class="skill-key-main">Z</b><small>1</small></span><span class="skill-name">炮击必杀</span><span class="skill-cost">35 能量</span><span class="skill-status">可用</span>
          </button>
          <button class="skill-button skill-magnet" type="button" data-control="bluePower2" data-skill="2" aria-label="Magnet 吸球, ready" title="Magnet">
            <span class="skill-icon" aria-hidden="true">⊕</span><span class="skill-key"><b class="skill-key-main">C</b><small>2</small></span><span class="skill-name">吸球</span><span class="skill-cost">20 能量</span><span class="skill-status">可用</span>
          </button>
          <button class="skill-button skill-jump" type="button" data-control="bluePower3" data-skill="3" aria-label="Sky Jump 高跳, ready" title="Sky Jump">
            <span class="skill-icon" aria-hidden="true">↟</span><span class="skill-key"><b class="skill-key-main">V</b><small>3</small></span><span class="skill-name">高跳</span><span class="skill-cost">15 能量</span><span class="skill-status">可用</span>
          </button>
          <button class="skill-button skill-freeze" type="button" data-control="bluePower4" data-skill="4" aria-label="Freeze 冻结, ready" title="Freeze">
            <span class="skill-icon" aria-hidden="true">❄</span><span class="skill-key"><b class="skill-key-main">B</b><small>4</small></span><span class="skill-name">冻结</span><span class="skill-cost">25 能量</span><span class="skill-status">可用</span>
          </button>
          <button class="skill-button skill-heal" type="button" data-control="bluePower5" data-skill="5" aria-label="Heal 回血, ready" title="Heal">
            <span class="skill-icon heal-icon" aria-hidden="true">+</span><span class="skill-key"><b class="skill-key-main">N</b><small>5</small></span><span class="skill-name">回血</span><span class="skill-cost">20 能量</span><span class="skill-status">可用</span>
          </button>
        </div>
      </section>

      <footer class="game-footer">
        <div class="brand-block">
          <span class="eyebrow">MATCH IN PROGRESS</span>
          <h1>2D Football Wars</h1>
        </div>
        <div class="match-settings" aria-label="Match settings">
          <span id="match-summary">BLUE vs RED</span>
          <button class="primary-button" id="start-btn" type="button"><span aria-hidden="true">▶</span> RESUME MATCH</button>
        </div>
        <div class="tool-actions">
          <button class="icon-button locale-button" id="locale-btn" type="button" aria-label="Switch language to 简体中文" title="Language">中文</button>
          <button class="icon-button" id="sound-btn" type="button" aria-label="Turn sound on" title="Sound off"><span aria-hidden="true">♫</span></button>
          <button class="icon-button" id="restart-btn" type="button" aria-label="Restart match" title="Restart"><span aria-hidden="true">↻</span></button>
          <button class="icon-button help-button" id="controls-btn" type="button" aria-label="Show controls" title="Controls"><span aria-hidden="true">?</span></button>
          <button class="icon-button" id="fullscreen-btn" type="button" aria-label="Enter fullscreen" title="Fullscreen"><span aria-hidden="true">⛶</span></button>
        </div>
      </footer>
      <section class="controls-strip" aria-label="Keyboard controls">
        <span id="controls-primary"></span><span id="controls-shot"></span><span id="controls-skill"></span><span id="controls-extra"></span><span><kbd>P</kbd> pause</span>
        <span class="local-controls" id="controls-secondary"><i></i></span>
      </section>
      </div>
    </main>

    <dialog id="help-dialog" class="help-dialog">
      <div class="dialog-head"><div><span class="eyebrow" id="help-eyebrow">ON THE PITCH</span><h2 id="help-title">Controls</h2></div><button class="icon-button" data-close-dialog aria-label="Close controls">×</button></div>
      <div class="control-columns" id="help-columns"></div>
      <p class="dialog-note" id="help-note"></p>
    </dialog>
    <script type="module" src="/main.js"></script>
  </body>
</html>
